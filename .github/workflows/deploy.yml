name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Firebase config from secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          sed -i \
            -e "s|%%FIREBASE_API_KEY%%|${FIREBASE_API_KEY}|g" \
            -e "s|%%FIREBASE_AUTH_DOMAIN%%|${FIREBASE_AUTH_DOMAIN}|g" \
            -e "s|%%FIREBASE_PROJECT_ID%%|${FIREBASE_PROJECT_ID}|g" \
            -e "s|%%FIREBASE_STORAGE_BUCKET%%|${FIREBASE_STORAGE_BUCKET}|g" \
            -e "s|%%FIREBASE_MESSAGING_SENDER_ID%%|${FIREBASE_MESSAGING_SENDER_ID}|g" \
            -e "s|%%FIREBASE_APP_ID%%|${FIREBASE_APP_ID}|g" \
            index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}

      - name: Deploy Firestore security rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] && [ -z "$FIREBASE_TOKEN" ]; then
            echo "⚠️  Neither FIREBASE_SERVICE_ACCOUNT nor FIREBASE_TOKEN secret is set."
            echo "   Firestore security rules will NOT be automatically deployed."
            echo ""
            echo "   IMPORTANT: Make sure you are adding these to repository SECRETS"
            echo "   (Settings → Secrets and variables → Actions → Secrets tab),"
            echo "   NOT to Variables. They will not work if stored as Variables."
            echo ""
            echo "   To fix this, follow README step 7 to either:"
            echo "   - Add a FIREBASE_SERVICE_ACCOUNT secret (recommended), or"
            echo "   - Add a FIREBASE_TOKEN secret (legacy), or"
            echo "   - Deploy the rules manually: firebase deploy --only firestore:rules"
            exit 0
          fi
          npm install -g firebase-tools@13
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            SA_KEY_FILE=$(mktemp)
            chmod 600 "$SA_KEY_FILE"
            trap 'rm -f "$SA_KEY_FILE"' EXIT
            echo "$FIREBASE_SERVICE_ACCOUNT" > "$SA_KEY_FILE"
            export GOOGLE_APPLICATION_CREDENTIALS="$SA_KEY_FILE"
            firebase use "$FIREBASE_PROJECT_ID"
            firebase deploy --only firestore:rules
          else
            firebase use "$FIREBASE_PROJECT_ID" --token "$FIREBASE_TOKEN"
            firebase deploy --only firestore:rules --token "$FIREBASE_TOKEN"
          fi
